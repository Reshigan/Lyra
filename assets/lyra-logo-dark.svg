<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="LYRA logo, dark surfaces">
  <rect width="600" height="200" rx="20" fill="#070B14"/>
  <!-- Vega mark: Lyra's asterism — Vega plus the parallelogram (68°/112°) -->
  <g fill="none" stroke="#AEB9CF" stroke-width="1.4" opacity="0.75">
    <path d="M92 84 L136 72 L150 116 L106 128 Z"/>
    <path d="M66 66 L92 84"/>
  </g>
  <g fill="#F4F7FC">
    <circle cx="92" cy="84" r="3"/>
    <circle cx="136" cy="72" r="2.6"/>
    <circle cx="150" cy="116" r="2.6"/>
    <circle cx="106" cy="128" r="2.6"/>
  </g>
  <!-- Vega -->
  <circle cx="64" cy="64" r="10" fill="#FFB020"/>
  <circle cx="64" cy="64" r="17" fill="none" stroke="#FFB020" stroke-width="1.1" opacity="0.4"/>
  <!-- Wordmark: textLength fixes width so the sightline accent always aligns -->
  <text x="200" y="112" font-family="Space Grotesk, Inter, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="500" letter-spacing="2" fill="#F4F7FC"
        textLength="176" lengthAdjust="spacingAndGlyphs">LYRA</text>
  <line x1="360" y1="97" x2="386" y2="71" stroke="#FFB020" stroke-width="3.4" stroke-linecap="round"/>
  <text x="202" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14"
        letter-spacing="0.6" fill="#AEB9CF">See everything. Act first.</text>
</svg>
