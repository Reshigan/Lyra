name: deploy

# Both stages are automatic on merge to main: staging first, then production
# queues behind it via the shared concurrency group (docs/10 §4). The
# `production` GitHub Environment keeps a branch policy (main only) but no
# reviewer gate as of 2026-08-22 — auto-deploy requested by Reshigan.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing deploys off a red main. Calls the exact same jobs ci.yml runs on
  # a PR (lint/typecheck/test/web-build/eval/e2e/mutation) instead of a
  # separate, thinner copy — a push-triggered staging deploy used to only
  # wait on lint+typecheck+test, so a build/e2e/eval/mutation break could
  # still ship. ci.yml no longer has its own push trigger, so this is the
  # only place those checks run for a push to main.
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  staging:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrations first, forward-only (CLAUDE.md §9). Migration dir comes from
      # apps/api/wrangler.jsonc -> ../../packages/db/migrations.
      - name: Apply D1 migrations (lyra-staging)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply lyra-staging --env staging --remote

      - name: Deploy lyra-api-staging
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging

      # API first: the web worker calls it, so a schema change should already
      # be live by the time the new UI is serving.
      - name: Deploy lyra-web-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @lyra/web deploy:staging

  production:
    # Runs after every green push to main (queued behind staging by the
    # concurrency group above) and on manual dispatch. Approval used to live
    # on the `production` Environment (required reviewer: Reshigan); that
    # gate was removed 2026-08-22 for auto-deploy. The Environment's branch
    # policy still restricts deployments to `main`.
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (lyra)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply lyra --remote

      - name: Deploy lyra-api
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Deploy lyra-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `run` keyword required: bare `pnpm deploy` is pnpm's builtin, not our script.
        run: pnpm --filter @lyra/web run deploy

# Secrets are handed to wrangler through `env:` on the step that needs them and
# are never expanded into a shell command. Do not add `set -x`, `echo`, or
# `--verbose` to a step above: Actions only masks values it knows verbatim.
# Worker runtime secrets (ANTHROPIC_API_KEY, OPENAI_COMPAT_API_KEY) are set with
# `wrangler secret put` out of band — they are not GitHub secrets.
