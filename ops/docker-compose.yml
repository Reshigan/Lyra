# On-prem twin (docs/11). Same code as the Cloudflare home, different adapters.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose -f ops/docker-compose.yml up -d
#
# Only `caddy` publishes a port. Everything else talks over the internal
# network (docs/11 §5). No value below is baked into an image — every setting
# is read from the env file, with a safe default or a hard `:?` failure.

name: lyra

x-app-env: &app-env
  RUNTIME: node
  ENVIRONMENT: ${ENVIRONMENT:-onprem}
  APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
  SESSION_COOKIE: ${SESSION_COOKIE:-lyra_session}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  LIBSQL_URL: ${LIBSQL_URL:-http://libsql:8080}
  LIBSQL_AUTH_TOKEN: ${LIBSQL_AUTH_TOKEN:-}
  # Internal model, OpenAI-compatible (docs/11 §2). Never leaves the estate.
  OPENAI_COMPAT_URL: ${OPENAI_COMPAT_URL:-http://llm:11434/v1}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embed:80}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-lyra-files}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  RENDER_URL: ${RENDER_URL:-http://render:3000}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  LYRA_LICENCE: ${LYRA_LICENCE:-}

x-app-build: &app-build
  build:
    context: ..
    dockerfile: ops/Dockerfile
  image: ${LYRA_IMAGE:-lyra/app:local}
  restart: unless-stopped
  networks: [internal]

services:
  # web + api + agents
  app:
    <<: *app-build
    environment:
      <<: *app-env
      MODE: app
      PORT: ${APP_PORT:-8787}
    depends_on:
      libsql: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # queues consumer, schedulers, workflows-inline (docs/11 §1)
  worker:
    <<: *app-build
    environment:
      <<: *app-env
      MODE: jobs
    depends_on:
      libsql: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Forward-only Drizzle migrations against libsql. One-shot; upgrades re-run it.
  migrate:
    <<: *app-build
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      LIBSQL_URL: ${LIBSQL_URL:-http://libsql:8080}
      LIBSQL_AUTH_TOKEN: ${LIBSQL_AUTH_TOKEN:-}
    depends_on:
      libsql: { condition: service_healthy }

  libsql:
    image: ${LIBSQL_IMAGE:-ghcr.io/tursodatabase/libsql-server:latest}
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_DB_PATH: /var/lib/sqld/lyra.db
    volumes:
      - libsql-data:/var/lib/sqld
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [internal]

  # Default tier is Ollama — docs/11 §2 calls it acceptable for pilots and
  # CPU-only demos, and it needs no GPU to come up. For a real deployment run
  # the `gpu` profile instead and point OPENAI_COMPAT_URL at llm-vllm.
  llm:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - models:/root/.ollama
    networks: [internal]

  llm-vllm:
    profiles: [gpu]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    command:
      - --model=${VLLM_MODEL:?set VLLM_MODEL}
      - --served-model-name=${VLLM_SERVED_NAME:-lyra-standard}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.92}
    volumes:
      - models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    networks: [internal]

  # bge-m3 embeddings, ar/en (docs/11 §1)
  embed:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-latest}
    restart: unless-stopped
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-m3}"]
    volumes:
      - models:/data
    networks: [internal]

  # PDF board packs, page snapshots
  render:
    image: ${RENDER_IMAGE:-ghcr.io/browserless/chromium:latest}
    restart: unless-stopped
    environment:
      TOKEN: ${RENDER_TOKEN:?set RENDER_TOKEN}
      CONCURRENT: ${RENDER_CONCURRENT:-2}
    networks: [internal]

  # The only service with a published port.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      LYRA_DOMAIN: ${LYRA_DOMAIN:?set LYRA_DOMAIN}
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8787}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [internal]

  # docs/11 §1 marks this optional: `docker compose --profile observability up -d`
  otel:
    profiles: [observability]
    image: ${OTEL_IMAGE:-grafana/otel-lgtm:latest}
    restart: unless-stopped
    volumes:
      - otel-data:/data
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  libsql-data:
  redis-data:
  minio-data:
  qdrant-data:
  models:
  caddy-data:
  caddy-config:
  otel-data:
